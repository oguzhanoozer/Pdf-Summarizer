# Lexicon — Talk to your PDFs
# FastAPI backend (Docker + Disk for ChromaDB) + Vite static frontend.

services:
  - type: web
    name: lexicon-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: chroma-data
      mountPath: /app/chroma_data
      sizeGB: 1

  - type: web
    name: lexicon-web
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy /api/* to backend. After first deploy of lexicon-api,
      # replace the destination with the actual Render URL.
      - type: rewrite
        source: /api/*
        destination: https://lexicon-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
