# Lexicon — Talk to your PDFs
# FastAPI backend (Docker) + Vite static frontend.
#
# NOTE on free tier:
#  - Render free tier doesn't allow persistent disks → ChromaDB lives in
#    memory and resets on every restart (~15 min idle = sleep). Fine for a
#    portfolio demo; upgrade to "starter" plan and re-add the `disk:` block
#    if you want persistence across restarts.

services:
  - type: web
    name: lexicon-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: lexicon-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy /api/* to backend. After first deploy of lexicon-api,
      # replace the destination with the actual Render URL if it differs.
      - type: rewrite
        source: /api/*
        destination: https://lexicon-api-pagx.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
